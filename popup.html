<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><link rel="stylesheet" href="popup.css"><title>Better Console</title></head>
<body>
<header class="topbar"><div class="brand"><span class="mark">⌘</span>Better Console <span class="version">PRO TOOLKIT</span></div><div class="actions"><button id="close-console" title="Close console">Close ✕</button><button id="pause" aria-pressed="false">Pause</button><button id="html-export" title="Export the current page HTML">Export HTML</button><button id="console-export">Export</button><button id="clear">Clear</button></div></header>
<nav class="tabs"><button class="tab active" data-tab="console">Console</button><button class="tab" data-tab="network">Network <i id="network-count">0</i></button><button class="tab" data-tab="elements">Elements</button><button class="tab" data-tab="storage">Storage</button><button class="tab" data-tab="info">Info</button><button class="tab" data-tab="snippets">Snippets</button></nav>
<section id="view-console" class="view active"><div class="toolbar"><input id="filter" type="search" placeholder="Filter messages…"><div class="levels"><button data-level="all" class="active">All</button><button data-level="error">Errors</button><button data-level="warn">Warnings</button><button data-level="info">Info</button></div><span id="count">0 messages</span></div><main id="output"><div class="empty">Waiting for page activity…</div></main><form id="command"><span class="prompt">›</span><input id="expression" spellcheck="false" placeholder="Evaluate JavaScript…"><button>Run</button></form></section>
<section id="view-network" class="view"><div class="toolbar"><input id="network-filter" placeholder="Filter URL or method"><button id="network-export">Export HAR</button><button id="network-clear">Clear</button><span id="network-total"></span></div><div class="table-wrap"><table><thead><tr><th>Method</th><th>Status</th><th>Type</th><th>URL</th><th>Time</th></tr></thead><tbody id="network-rows"></tbody></table></div><pre id="network-detail" class="detail">Select a request to inspect its details.</pre></section>
<section id="view-elements" class="view"><div class="toolbar"><input id="selector" value="body" placeholder="CSS selector"><button id="inspect-selector">Inspect</button><button id="highlight">Highlight</button><button id="element-hide">Hide</button><button id="element-text">Edit text</button><button id="element-copy">Copy selector</button><button id="element-tree">DOM tree</button></div><pre id="element-result" class="detail">Enter a CSS selector to inspect matching elements.</pre></section>
<section id="view-storage" class="view"><div class="toolbar"><button data-store="localStorage" class="active">Local Storage</button><button data-store="sessionStorage">Session Storage</button><button data-store="cookies">Cookies</button><button id="storage-export">Export</button><button id="storage-refresh">Refresh</button></div><div class="storage-add"><input id="storage-key" placeholder="Key / cookie name"><input id="storage-value" placeholder="Value"><button id="storage-save">Save</button></div><div id="storage-rows"></div></section>
<section id="view-info" class="view"><div class="toolbar"><button id="info-copy">Copy report</button><button id="info-refresh">Refresh page info</button></div><pre id="info-result" class="detail">Loading page information…</pre></section>
<section id="view-snippets" class="view"><div class="toolbar"><input id="snippet-name" placeholder="Snippet name"><button id="snippet-save">Save current code</button></div><textarea id="snippet-code" spellcheck="false" placeholder="// Write reusable JavaScript here"></textarea><div class="toolbar"><select id="snippet-list"><option value="">Saved snippets…</option></select><button id="snippet-run">Run</button><button id="snippet-delete">Delete</button></div></section>
<script src="popup.js"></script></body></html>
